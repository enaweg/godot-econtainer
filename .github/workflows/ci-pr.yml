name: CI-PR

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Build
        working-directory: src/e-container
        run: dotnet build gContainer.sln --configuration Debug

      - name: Rebuild Godot project cache
        working-directory: src/e-container
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000
