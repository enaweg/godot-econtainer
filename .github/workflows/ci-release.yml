name: CI-Release

on:
  push:
    tags:
      - "v*"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 200
          fetch-tags: true
          
      - name: Initialize version
        shell: bash
        run: |
          echo "VERSION=$( git describe --tags | sed -E 's/v([0-9\.]+)(:?.*)/\1/g' )" >> "$GITHUB_ENV"

      - name: Set Version to plugin.ini
        shell: bash
        run: |
          sed -i "s/version=\".*\"/version=\"${{ env.VERSION }}\"/g" src/e-container/addons/eContainer/plugin.cfg

      - name: Create artifact
        shell: bash
        run: |
          mkdir out/
          cd src/e-container
          zip -r ../../out/eContainer-v${VERSION}.zip addons/eContainer

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.2.3
        with:
          mode: "HYBRID"
          configurationJson: |
            {
               "template": "#{{CHANGELOG}}\n",
               "categories": [
                 {
                     "title": "## Feature",
                     "labels": ["feat", "feature"]
                 },
                 {
                     "title": "## Fix",
                     "labels": ["fix", "bug"]
                 },
                 {
                     "title": "## Other",
                     "labels": []
                 }
               ],
               "ignore_labels": [
                 "ignore"
               ],
               "label_extractor": [
                 {
                   "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                   "on_property": "title",
                   "target": "$1"
                 }
               ],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "v(.+)",
                  "flags": "gu"
                }
              }
             }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "eContainer-v${{ env.VERSION }}"
          body: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          artifacts: "out/eContainer-v${{ env.VERSION }}.zip"

      