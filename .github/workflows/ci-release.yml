name: CI-Release

on:
  push:
    tags:
      - "v*"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 200
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Build
        working-directory: src/e-container
        run: dotnet build eContainer.sln --configuration Debug

      - name: Rebuild Godot project cache
        working-directory: src/e-container
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/e-container
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test eContainer.sln --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1

      - name: Initialize version
        shell: bash
        run: |
          echo "VERSION=$( git describe --tags | sed -E 's/v([0-9\.]+)(:?.*)/\1/g' )" >> "$GITHUB_ENV"

      - name: Set Version to plugin.cfg
        shell: bash
        run: |
          sed -i "s/version=\".*\"/version=\"${{ env.VERSION }}\"/g" src/e-container/addons/eContainer/plugin.cfg

      - name: Deactivate plugin for distribution
        shell: bash
        run: |
          mv src/e-container/addons/eContainer/src src/e-container/addons/eContainer/.src

      - name: Create artifact
        shell: bash
        run: |
          mkdir out/
          cd src/e-container
          zip -r ../../out/eContainer-v${VERSION}.zip addons/eContainer

      - name: Verify artifact contents
        shell: bash
        run: |
          unzip -l out/eContainer-v${VERSION}.zip
          for required in \
            addons/eContainer/plugin.cfg \
            addons/eContainer/LICENSE \
            addons/eContainer/EContainerPlugin.cs \
            addons/eContainer/eContainer.tscn \
            addons/eContainer/.src/Runtime/Godot/LifetimeScope.cs \
            addons/eContainer/.libs/VContainer.Standalone.1.19.0.nupkg \
            addons/eContainer/.libs/VContainer.SourceGenerator.1.19.0.nupkg
          do
            unzip -l "out/eContainer-v${VERSION}.zip" "$required" > /dev/null \
              || { echo "::error::missing from release archive: $required"; exit 1; }
          done

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.3.0
        with:
          mode: "HYBRID"
          configurationJson: |
            {
               "template": "#{{CHANGELOG}}\n",
               "categories": [
                 {
                     "title": "## Feature",
                     "labels": ["feat", "feature"]
                 },
                 {
                     "title": "## Fix",
                     "labels": ["fix", "bug"]
                 },
                 {
                     "title": "## Other",
                     "labels": []
                 }
               ],
               "ignore_labels": [
                 "ignore"
               ],
               "label_extractor": [
                 {
                   "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                   "on_property": "title",
                   "target": "$1"
                 }
               ],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "v(.+)",
                  "flags": "gu"
                }
              }
             }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "eContainer-v${{ env.VERSION }}"
          body: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          artifacts: "out/eContainer-v${{ env.VERSION }}.zip"
